name: Build & Deploy

# 源码分支 -> 构建静态导出 -> 把产物提交到 main（Pages legacy 从 main 根目录部署）
# 注意：不切换 Pages 的 build_type，零切换风险；产物提交后 pages-build-deployment 自动接管。

on:
  push:
    branches: [source]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'DESIGN.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # esbuild 的 postinstall 在 Windows 上会报 EBUSY；Linux 正常，但统一跳过
      # 更稳妥（esbuild 二进制由平台可选依赖提供，postinstall 仅做自校验）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Build static export
        run: pnpm exec next build --webpack

      - name: Verify export
        run: |
          test -f out/index.html   || { echo "missing out/index.html";   exit 1; }
          test -f out/.nojekyll    || { echo "missing out/.nojekyll";   exit 1; }
          echo "export ok: $(find out -name '*.html' | wc -l) html / $(find out -type f | wc -l) files"

      - name: Publish build output to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth=1 --branch=main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
          cd deploy
          # 身份必须配置在 deploy 这个仓库里（runner 全局无 git 身份）
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq . 2>/dev/null || true
          cp -r "${GITHUB_WORKSPACE}/out/." .
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git commit -m "build: deploy from source@${GITHUB_SHA::7}"
          git push origin main
